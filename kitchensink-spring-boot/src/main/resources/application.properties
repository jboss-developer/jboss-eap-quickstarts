# Spring Boot application configuration
# Application name
spring.application.name=kitchensink-spring-boot

# Server configuration
server.port=8080
server.servlet.context-path=/kitchensink

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:kitchensinkdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:import.sql

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false

# Logging Configuration
logging.level.root=INFO
logging.level.org.jboss.as.quickstarts.kitchensink=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Disable Open Session in View to avoid LazyInitializationException
spring.jpa.open-in-view=false
