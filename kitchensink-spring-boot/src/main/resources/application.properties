# Application name
spring.application.name=kitchensink

# Server configuration
server.port=8080

# DataSource configuration (matches JBoss H2 setup)
spring.datasource.url=jdbc:h2:mem:kitchensink;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# JPA/Hibernate configuration (matches JBoss persistence.xml)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.org.jboss.eap.quickstarts.kitchensink=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
